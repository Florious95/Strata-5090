name: C2 production config

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  config-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s ops -p test_c2_golden.py -v
      - run: bash -n ops/deploy-c2-golden.sh
