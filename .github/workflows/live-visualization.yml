name: Live visualization contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu-display-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing Pillow dependency and monospace PNG font (tools only)
        run: |
          python -m pip install pillow
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Read-only monitor and evidence-chart contracts
        run: python -m unittest tools.test_live_visualization -v
      - name: Real SVG-only command, no GPU or plotting dependency
        run: python tools/render_throughput_comparison.py --svg-only --output /tmp/throughput-pending
