name: Fork evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-and-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate archive, evidence arithmetic and documentation
        run: python -m unittest discover -s tools -p test_fork_evidence.py -v
